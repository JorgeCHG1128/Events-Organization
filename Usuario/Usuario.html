<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Registro de Estudiantes</title>
    <link rel="stylesheet" href="stylesUsuario.css">
    
</head>
<body>
  
  
    <!-- Contenedor Principal -->
    <div id="mainContainer" class="container">
        <div class="top-bar">
            <h1>Sistema de Registro de Usuario </h1>
            
        </div>

        <!-- Formulario de Registro Mejorado -->
        <div class="form-container">
            <div class="form-header">
                <h2 id="formTitle">Registrar Nuevo Usuario</h2>
            </div>
            
            <div class="form-row">
                <div class="form-col">
                    <div class="form-card">
                        <h3 class="form-card-title">Información Personal</h3>
                        <div class="form-group">
                            <label for="name">Nombre Completo:</label>
                            <input type="text" id="name" placeholder="Ingrese nombre completo" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Correo Electrónico:</label>
                            <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                        </div>
                        <div class="form-group">
                            <label for="age">Edad:</label>
                            <input type="number" id="age" min="16" max="99" placeholder="Ingrese edad" required>
                        </div>
                    </div>
                </div>
                
                <div class="form-col">
                    <div class="image-upload-container">
                        <h3 class="form-card-title">Foto de Perfil</h3>
                        <img id="imagePreview" class="profile-preview" src="/api/placeholder/100/100" alt="Vista previa">
                        
                        <div class="file-input-container">
                            <label class="file-input-button" for="profileImage">Seleccionar Imagen</label>
                            <input type="file" id="profileImage" accept="image/*" onchange="previewImage()">
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="btn-group">
                <button onclick="saveStudent()">Guardar Usuario</button>
                <button class="btn-secondary" onclick="resetForm()">Cancelar</button>
            </div>
        </div>

        <!-- Barra de Búsqueda -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Buscar por nombre o correo...">
            <button onclick="searchStudents()">Buscar</button>
        </div>

        <!-- Tabla de Usuarios -->
        <table id="studentsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Foto</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Edad</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="studentsList">
                <!-- Los estudiantes se cargarán aquí -->
            </tbody>
        </table>
    </div>

    <script src="usuario.js"></script>

</body>
</html>
